name: Build Debug APK

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./LimeStudio/gradlew

    - name: Build Debug APK
      run: cd LimeStudio && ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: debug-apk
        path: LimeStudio/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: List APK files
      run: ls -lh LimeStudio/app/build/outputs/apk/debug/
